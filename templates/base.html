<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DOUANEPLUS{% endblock %}</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#14213d;--muted:#5b6475;--brand:#0b5cab;--brand-d:#08467f;--line:#e2e6ec;--err:#b3261e}
  *{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  header{background:var(--ink);color:#fff;padding:14px 20px}
  header b{letter-spacing:.06em;font-size:1.1rem} header span{color:#9fb3d6;margin-left:10px;font-size:.9rem}
  main{max-width:760px;margin:0 auto;padding:22px 16px 48px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}
  h1{font-size:1.55rem;line-height:1.25;margin:.2em 0 .4em} h2{font-size:1.1rem;margin:0 0 .6em}
  p{margin:.4em 0} .muted{color:var(--muted)} ul{padding-left:1.2em;margin:.4em 0} li{margin:.35em 0}
  label{display:block;font-weight:600;margin:14px 0 4px}
  input[type=text],input[type=email]{width:100%;padding:12px;border:1px solid #c3cad6;border-radius:8px;font-size:1rem}
  .check{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:14px} .check input{margin-top:4px}
  button,.btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:13px 20px;font-size:1rem;font-weight:600;cursor:pointer;text-decoration:none}
  button:hover,.btn:hover{background:var(--brand-d)} .btn.sec{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  .err{background:#fdecea;color:var(--err);border:1px solid #f3c1bd;padding:10px 12px;border-radius:8px;margin-bottom:10px}
  .key{font-family:ui-monospace,Consolas,monospace;word-break:break-all;background:#f1f4f9;border:1px dashed #9fb3d6;border-radius:8px;padding:14px;font-size:.92rem;user-select:all}
  .hp{position:absolute;left:-9999px;height:0;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:.9rem} th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
  footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 30px}
</style>
</head>
<body>
<header><b>DOUANEPLUS</b><span>Cotation douanière CEMAC</span></header>
<main>{% block content %}{% endblock %}</main>
<footer>DOUANEPLUS · Douala, Cameroun</footer>
</body>
</html>
