services:
  - type: web
    name: douaneplus-portail
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: LICENSE_PRIVATE_KEY_B64
        sync: false
      - key: DOWNLOAD_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_URL
        sync: false
      - key: IP_SALT
        generateValue: true
